name: Generar ZIP descargable de Mi despensa
on:
  push:
    branches: [main, actualizacion-despensa-v2]
    paths:
      - '.github/workflows/generar-descargas.yml'
      - 'index.html'
      - 'style.css'
      - 'data.js'
      - 'logic.js'
      - 'app.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'version.json'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'Guia_despensa_30_dias_noviembre_2026.pdf'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mi-despensa-zip
  cancel-in-progress: false
jobs:
  empaquetar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Comprobar sintaxis de la app
        run: |
          node --check data.js
          node --check logic.js
          node --check app.js
          node --check sw.js
      - name: Crear ZIP desde la versión actual
        run: |
          python - <<'PY'
          import zipfile, pathlib
          files = [
            'index.html','style.css','data.js','logic.js','app.js',
            'sw.js','manifest.webmanifest','version.json',
            'icon-192.png','icon-512.png',
            'Guia_despensa_30_dias_noviembre_2026.pdf'
          ]
          for file in files:
              if not pathlib.Path(file).is_file():
                  raise SystemExit('Falta archivo: '+file)
          with zipfile.ZipFile('Mi_despensa_webapp_iPhone.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for file in files: out.write(file)
          with zipfile.ZipFile('Mi_despensa_webapp_iPhone.zip') as z:
              assert z.testzip() is None
              assert set(files)==set(z.namelist())
          print('ZIP actualizado con todos los recursos de la app')
          PY
      - name: Guardar paquete actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mi_despensa_webapp_iPhone.zip
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar ZIP de Mi despensa"
            git push
          fi
